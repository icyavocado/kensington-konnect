[package]
name = "kensington-trackball"
version = "1.0.0"
edition = "2024"
description = "Control panel for a Kensington Expert Trackball on Linux (Wayland + Hyprland)"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
  "default_fonts",
  "glow",
  "accesskit",
  "links",
  "wayland",
  "x11",
] }
egui = "0.36"
evdev = "0.13"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
